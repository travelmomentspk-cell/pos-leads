# =====================================================================================
# CLOUD CONFIG: the one file that controls the GitHub Actions run (run_cloud.py).
# Edit categories, cities, thresholds and sources here. The Google Sheet dropdowns are refreshed
# from this file at the end of every run (Lists tab), so new categories appear there by themselves.
# =====================================================================================

run:
  default_category: ALL        # a category name from the list below, several separated by commas, or ALL
  default_city: ALL            # a city from the list below, or ALL
  min_score: 70                # a lead below this score is rejected and never reaches the Sheet
  target_leads_per_run: 50     # continue in search batches until this many new leads are delivered
  max_runtime_minutes: 270     # stop with time remaining before the 330-minute Actions job limit
  daily_cap: 1000              # ceiling per run only; real volume depends on how many businesses pass the rules
  queries_per_run: 10          # per-batch searches; screen, upload and checkpoint before the next batch
  max_review_count: 1500       # more Google reviews than this = too big or chain-like
  rejected_retry_days: 14      # a rejected business is not looked at again for this many days

quality:
  require_decision_maker: true   # Owner, Founder, CEO, President, Director or Manager, with a name
  require_phone: true            # a valid Canadian phone number
  require_email: true            # a usable email (found on their own website or by the Maps scraper)
  # A lead missing any required item is NOT written to New Leads. It goes to the Rejected tab with the reason.

sources:
  google_maps:     {enabled: true, depth: 3}           # business searches (category x city)
  website_pages:   {enabled: true, workers: 8, timeout_seconds: 10}   # About, Team, Contact pages and schema.org data
  linkedin_via_google_search:                          # official Google Programmable Search API, only public snippets
    enabled: true                                      # needs GOOGLE_CSE_KEY and GOOGLE_CSE_CX secrets (free, 100 searches a day)
    daily_budget: 80
  provider_complaints: {enabled: false}                # bad reviews about POS/payment/website providers (config_extra.yaml)

# -------------------------------------------------------------------------------------
