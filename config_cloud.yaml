         Vancouver BC, Surrey BC, Burnaby BC, Calgary AB, Edmonton AB, Winnipeg MB, Saskatoon SK, Halifax NS,
         Oshawa ON, Richmond BC, Victoria BC, Kelowna BC, Coquitlam BC, Langley BC, Laval QC, Gatineau QC, Regina SK, Red Deer AB]
